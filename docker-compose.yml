

services:
  app_testing:
    build: .          
    container_name: laravel_qa_container
    working_dir: /var/www/html  
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www/html
    ports:
      - "8080:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database_qa
      DB_PORT: 3306
      APP_KEY: ${APP_KEY}
    depends_on:
      database_qa:
        condition: service_healthy
    networks:
      - qa_network

  database_qa:
    image: mysql:${DB_VERSION}
    container_name: mysql_qa_container
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOTPASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./carpeta_db_qa:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - qa_network

networks:
  qa_network:
    driver: bridge